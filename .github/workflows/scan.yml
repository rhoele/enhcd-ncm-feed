name: 云端扫描新作（移动端静态快照）

# 逐艺人调用 /artist/album 抓取近 7 天新作，产出 data/mobile/ 静态快照并提交回 gh-pages。
# 移动端只读这些同源 JSON，彻底规避「HTTPS 页面请求 http:// 本地后端」的混合内容拦截。
#
# 「合辑参与」（关注艺人出现在他人专辑里）成本远高于新作（每位艺人约 6 个请求，
# 全量一次要 6.9 万请求 ≈ 3 小时），因此按 --compilation-shards 分片轮转：每次只扫
# 1/N 的艺人，已确认发行时间的专辑写进 data/mobile/album-dates.json 跨次复用，
# 游标存在 index.json 的 compilation_shard 里逐次前进。每天 9 次 cron 与 8 片互质，可覆盖全部。
#
# 注意：GitHub Actions 的 cron 使用 UTC，且为 best-effort（高峰期常延迟 5~30 分钟）。
# 下面所有 cron 已换算为北京时间 = UTC + 8。
#
# 实测：云端 /artist/album 每次约 4 秒（瓶颈在 runner 到网易的网络路径），
#       并发 16 时全量 9608 艺人约需 44 分钟。因此频率不宜过密，否则会互相排队。
#       job 时限 90 分钟：新作约 44 分钟 + 合辑分片（预算 25 分钟）仍有富余。

on:
  schedule:
    # 北京时间 00:05（= 前一天 UTC 16:05）—— 过零点开跑，约 00:50 出结果
    - cron: '5 16 * * *'
    # 北京时间 00:50（= 前一天 UTC 16:50）—— 兜底重跑一次
    - cron: '50 16 * * *'
    # 北京时间 04:00 / 07:00（= 前一天 UTC 20:00 / 23:00）
    - cron: '0 20,23 * * *'
    # 北京时间 10:00 / 13:00 / 16:00 / 19:00 / 22:00（= UTC 02/05/08/11/14）
    - cron: '0 2,5,8,11,14 * * *'
  workflow_dispatch:
    inputs:
      max_artists:
        description: '只扫描前 N 个艺人（试跑用，0 = 全部 9608 个）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（默认 16）'
        required: false
        default: '16'
      compilation_shards:
        description: '合辑分片数（默认 8，每次只扫 1/N 的艺人轮转）'
        required: false
        default: '8'

permissions:
  contents: write

# 同一时间只跑一个扫描任务，避免两个 job 同时改快照后推冲突
concurrency:
  group: cloud-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 拉取 gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查公开配置隐私
        run: node scripts/lib/check-public.js .

      - name: 验证接口与会话隔离
        run: node --test scripts/test-public.js

      - name: 启动网易云 API 服务
        env:
          PORT: '3100'
        run: |
          npx -y NeteaseCloudMusicApi@4.32.0 > /tmp/ncm-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3100/album/new?area=ALL&limit=1" > /dev/null; then
              echo "NeteaseCloudMusicApi 已就绪（${i}0s 内）"
              for n in 1 2 3; do
                echo "  第 $n 次 /artist/album 上游耗时：$(curl -s -o /dev/null -w '%{time_total}s' 'http://127.0.0.1:3100/artist/album?id=13430&limit=100')"
              done
              exit 0
            fi
            sleep 2
          done
          echo "::error::网易云 API 启动超时"
          tail -n 40 /tmp/ncm-api.log
          exit 1

      - name: 逐艺人扫描并生成快照
        env:
          # 可选：在仓库 Settings → Secrets 里配置 NETEASE_MUSIC_U 可提升稳定性；
          # 未配置时以匿名身份扫描（/artist/album 匿名可用）。
          NAF_NCM_COOKIE: ${{ secrets.NETEASE_MUSIC_U }}
        run: |
          node scripts/cloud-scan.js \
            --out . \
            --api http://127.0.0.1:3100 \
            --days 7 \
            --concurrency "${{ github.event.inputs.concurrency || 16 }}" \
            --compilation-shards "${{ github.event.inputs.compilation_shards || 8 }}" \
            --compilation-budget-sec 1500 \
            --max-artists "${{ github.event.inputs.max_artists || 0 }}"

      - name: 提交快照
        run: |
          git config user.name  "naf-scan-bot"
          git config user.email "naf-scan-bot@users.noreply.github.com"
          git add data/mobile
          if git diff --cached --quiet; then
            echo "快照无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(snapshot): 云端扫描 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          # 本机可能同时推送过，先 rebase 再推，避免 non-fast-forward
          git pull --rebase --autostash origin gh-pages || true
          git push origin gh-pages
